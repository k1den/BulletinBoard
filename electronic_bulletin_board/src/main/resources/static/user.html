<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователями</title>
    <link rel="stylesheet" href="css/user.css">
</head>

<nav>
    <div class="nav-buttons">
        <button onclick="window.location.href='ads.html'">Объявления</button>
        <button onclick="window.location.href='admin.html'">Админ-панель</button>
        <button onclick="logout()">Выйти</button>
    </div>
    <div id="navMessages">
        <div id="navErrorContainer" style="display: none;">
            <p id="navErrorMessage"></p>
        </div>
        <div id="navSuccessContainer" style="display: none;">
            <p id="navSuccessMessage"></p>
        </div>
    </div>
</nav>

<body>
<h2>Список пользователей</h2>
<table id="usersTable">
    <thead>
    <tr><th>ID</th><th>Логин</th><th>Роль</th><th>Действия</th></tr>
    </thead>
    <tbody></tbody>
</table>

<div id="modal">
    <h4>Изменить роль</h4>
    <select id="newRole">
        <option>Пользователь</option>
        <option>Администратор</option>
    </select>
    <button onclick="saveRole()">Сохранить</button>
    <button onclick="closeModal()">Отмена</button>
</div>

<div id="google_translate_element"></div>

<script src="js/users.js"></script>
</body>
</html>
