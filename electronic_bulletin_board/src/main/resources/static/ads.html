<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="ru">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Управление Объявлениями</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #343a40;
        }
        form {
            background-color: #ffffff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        div#advertisementDetails, div#advertisementsByCategory {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1>Управление Объявлениями</h1>

<h2>Добавить Объявление</h2>
<form id="addAdvertisementForm">
    <input type="text" id="title" placeholder="Название" required>
    <input type="number" id="idCategory" placeholder="ID категории" required>
    <textarea id="description" placeholder="Описание" required></textarea>
    <input type="text" id="price" placeholder="Цена" required>
    <input type="number" id="idUsers" placeholder="ID пользователя" required>
    <input type="text" id="photo" placeholder="Ссылка на фото" required>
    <button type="submit">Добавить Объявление</button>
</form>

<h2>Удалить Объявление</h2>
<form id="deleteAdvertisementForm">
    <input type="number" id="deleteId" placeholder="ID объявления" required>
    <button type="submit">Удалить Объявление</button>
</form>

<h2>Редактировать Объявление</h2>
<form id="updateAdvertisementForm">
    <input type="number" id="updateId" placeholder="ID объявления" required>
    <input type="text" id="updateTitle" placeholder="Новое название">
    <input type="number" id="updateCategory" placeholder="Новый ID категории">
    <textarea id="updateDescription" placeholder="Новое описание"></textarea>
    <input type="text" id="updatePrice" placeholder="Новая цена">
    <input type="text" id="updatePhoto" placeholder="Новая ссылка на фото">
    <button type="submit">Редактировать Объявление</button>
</form>

<h2>Получить Объявление</h2>
<input type="number" id="getId" placeholder="ID объявления">
<button id="getAdvertisementButton">Получить Объявление</button>
<div id="advertisementDetails"></div>

<h2>Объявления по категории</h2>
<input type="text" id="categoryName" placeholder="Название категории">
<button id="getByCategoryButton">Получить Объявления</button>
<div id="advertisementsByCategory"></div>

<script>
    const apiUrl = '/api/advertisements';

    document.getElementById('addAdvertisementForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const data = {
            title: document.getElementById('title').value,
            idCategory: document.getElementById('idCategory').value,
            description: document.getElementById('description').value,
            price: document.getElementById('price').value,
            idUsers: document.getElementById('idUsers').value,
            photo: document.getElementById('photo').value
        };
        fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        }).then(response => response.json()).then(data => {
            alert('Объявление добавлено: ' + JSON.stringify(data));
        }).catch(error => console.error('Ошибка:', error));
    });

    document.getElementById('deleteAdvertisementForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const id = document.getElementById('deleteId').value;
        fetch(`${apiUrl}/${id}`, {
            method: 'DELETE'
        }).then(() => {
            alert('Объявление удалено');
        }).catch(error => console.error('Ошибка:', error));
    });

    document.getElementById('updateAdvertisementForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const id = document.getElementById('updateId').value;
        const data = {};
        if (document.getElementById('updateTitle').value) {
            data.title = document.getElementById('updateTitle').value;
        }
        if (document.getElementById('updateCategory').value) {
            data.idCategory = document.getElementById('updateCategory').value;
        }
        if (document.getElementById('updateDescription').value) {
            data.description = document.getElementById('updateDescription').value;
        }
        if (document.getElementById('updatePrice').value) {
            data.price = document.getElementById('updatePrice').value;
        }
        if (document.getElementById('updatePhoto').value) {
            data.photo = document.getElementById('updatePhoto').value;
        }
        fetch(`${apiUrl}/${id}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        }).then(response => response.json()).then(data => {
            alert('Объявление обновлено: ' + JSON.stringify(data));
        }).catch(error => console.error('Ошибка:', error));
    });

    document.getElementById('getAdvertisementButton').addEventListener('click', function() {
        const id = document.getElementById('getId').value;
        fetch(`${apiUrl}/${id}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('advertisementDetails').innerText = JSON.stringify(data);
            })
            .catch(error => console.error('Ошибка:', error));
    });

    document.getElementById('getByCategoryButton').addEventListener('click', function() {
        const categoryName = document.getElementById('categoryName').value;
        fetch(`${apiUrl}/by-category?categoryName=${categoryName}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('advertisementsByCategory').innerText = JSON.stringify(data);
            })
            .catch(error => console.error('Ошибка:', error));
    });
</script>

</body>
</html>
