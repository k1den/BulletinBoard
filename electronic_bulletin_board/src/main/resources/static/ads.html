<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Объявлениями</title>
    <link rel="stylesheet" href="css/ads.css">
</head>
<body>

<nav>
    <div class="nav-buttons">
        <button id="addAdvertisementButton" onclick="toggleForm('addAdvertisementForm')">Добавить</button>
        <button id="searchByCategoryButton" onclick="toggleSearchForm()">Поиск</button>
        <button onclick="window.location.href='cart.html'">Корзина</button>
    </div>
    <div id="navMessages">
        <div id="navErrorContainer"
             style="display: none; color: red; padding: 5px 10px; border: 1px solid red; background-color: #ffe6e6; border-radius: 4px;">
            <p id="navErrorMessage"></p>
        </div>
        <div id="navSuccessContainer"
             style="display: none; color: green; padding: 5px 10px; border: 1px solid green; background-color: #e6ffe6; border-radius: 4px;">
            <p id="navSuccessMessage"></p>
        </div>
    </div>
    <div class="nav-buttons">
        <button id="loginButton" onclick="window.location.href='login.html'">Войти</button>
        <button id="logoutButton" onclick="logout()">Выйти</button>
    </div>
</nav>

<div id="formContainer" class="form-container" style="display: none;">
    <form id="addAdvertisementForm" enctype="multipart/form-data">
        <h2>Добавить Объявление</h2>
        <input type="text" id="title" placeholder="Название" required>
        <select id="categorySelect" required>
            <option value="">Выберите категорию</option>
        </select>
        <textarea id="description" placeholder="Описание" required></textarea>
        <input type="text" id="price" placeholder="Цена" required>
        <input type="file" id="photo" accept="image/*" required>
        <button type="submit">Добавить Объявление</button>
    </form>
</div>

<div id="searchContainer" class="search-container" style="display: none;">
    <div id="searchCategoryContainer">
        <h2>Поиск по категории</h2>
        <select id="categoryNameSelect">
            <option value="">Выберите категорию</option>
        </select>
        <button id="getByCategoryButton">Получить Объявления</button>
        <button id="resetSearchButton" style="display:none;" onclick="resetSearch()">Сбросить поиск</button>
    </div>
</div>

<div class="container">
    <form id="editAdvertisementForm" style="display:none;" enctype="multipart/form-data">
        <h2>Редактировать Объявление</h2>
        <input type="hidden" id="editId">
        <input type="text" id="editTitle" placeholder="Название" required>
        <select id="editCategorySelect" required>
            <option value="">Выберите категорию</option>
        </select>
        <textarea id="editDescription" placeholder="Описание" required></textarea>
        <input type="text" id="editPrice" placeholder="Цена" required>
        <input type="file" id="editPhoto" accept="image/*">
        <button type="submit">Сохранить изменения</button>
    </form>

    <div id="commentFormContainer" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 1001;">
        <h3>Добавить комментарий</h3>
        <input type="hidden" id="commentAdId">
        <textarea id="commentText" placeholder="Ваш комментарий" style="width: 300px; height: 100px; margin-bottom: 10px;"></textarea>
        <div style="display: flex; gap: 10px;">
            <button onclick="submitComment()">Отправить</button>
            <button onclick="closeCommentForm()">Отмена</button>
        </div>
    </div>

    <div class="card-container" id="advertisementsByCategory"></div>

    <h2>Все Объявления</h2>
    <div class="card-container" id="allAdvertisements"></div>
</div>

<div id="commentModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); z-index: 1002;">
    <h3>Комментарий</h3>
    <p id="commentModalText"></p>
    <button onclick="document.getElementById('commentModal').style.display = 'none'">OK</button>
</div>

<script src="js/ads.js"></script>
</body>
</html>
