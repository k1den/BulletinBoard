<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .message {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>

<h2>Регистрация</h2>
<div class="form-group">
    <label for="regEmail">Email:</label>
    <input type="email" id="regEmail" required>
</div>
<div class="form-group">
    <label for="regLogin">Логин:</label>
    <input type="text" id="regLogin" required>
</div>
<div class="form-group">
    <label for="regPassword">Пароль:</label>
    <input type="password" id="regPassword" required>
</div>
<button onclick="register()">Зарегистрироваться</button>

<div class="message" id="regMessage"></div>

<h2>Вход</h2>
<div class="form-group">
    <label for="login">Логин:</label>
    <input type="text" id="login" required>
</div>
<div class="form-group">
    <label for="password">Пароль:</label>
    <input type="password" id="password" required>
</div>
<button onclick="login()">Войти</button>

<div class="message" id="loginMessage"></div>

<script>
    async function register() {
        const email = document.getElementById('regEmail').value;
        const login = document.getElementById('regLogin').value;
        const password = document.getElementById('regPassword').value;

        const response = await fetch('/api/auth/register?email=' + email + '&login=' + login + '&password=' + password, {
            method: 'POST'
        });

        const messageElement = document.getElementById('regMessage');
        if (response.ok) {
            const user = await response.json();
            messageElement.textContent = 'Регистрация прошла успешно! Пользователь: ' + user.login;
            messageElement.style.color = 'green';
        } else {
            const errorMessage = await response.text();
            messageElement.textContent = 'Ошибка: ' + errorMessage;
            messageElement.style.color = 'red';
        }
    }

    async function login() {
        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth/login?login=' + login + '&password=' + password, {
            method: 'POST'
        });

        const messageElement = document.getElementById('loginMessage');
        if (response.ok) {
            const user = await response.json();
            messageElement.textContent = 'Вход выполнен успешно! Пользователь: ' + user.login;
            messageElement.style.color = 'green';
        } else {
            const errorMessage = await response.text();
            messageElement.textContent = 'Ошибка: ' + errorMessage;
            messageElement.style.color = 'red';
        }
    }
</script>

</body>
</html>
